<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e">The Event vs. Interval Distinction</text>
  <text x="430" y="58" text-anchor="middle" font-size="13" fill="#555">Why both KG and T2P scored 0% on comorbidity questions — and how interval-overlap fixes it</text>

  <!-- Wave axis -->
  <g font-size="12" fill="#333">
    <line x1="120" y1="120" x2="800" y2="120" stroke="#999" stroke-width="1.5"/>
    <line x1="120" y1="120" x2="120" y2="470" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="217" y1="110" x2="217" y2="470" stroke="#eee" stroke-width="1"/>
    <line x1="314" y1="110" x2="314" y2="470" stroke="#eee" stroke-width="1"/>
    <line x1="411" y1="110" x2="411" y2="470" stroke="#eee" stroke-width="1"/>
    <line x1="508" y1="110" x2="508" y2="470" stroke="#eee" stroke-width="1"/>
    <line x1="605" y1="110" x2="605" y2="470" stroke="#eee" stroke-width="1"/>
    <line x1="702" y1="110" x2="702" y2="470" stroke="#eee" stroke-width="1"/>
    <text x="120" y="105" text-anchor="middle" font-weight="600">W1</text>
    <text x="217" y="105" text-anchor="middle" font-weight="600">W2</text>
    <text x="314" y="105" text-anchor="middle" font-weight="600">W3</text>
    <text x="411" y="105" text-anchor="middle" font-weight="600">W4</text>
    <text x="508" y="105" text-anchor="middle" font-weight="600">W5</text>
    <text x="605" y="105" text-anchor="middle" font-weight="600">W6</text>
    <text x="702" y="105" text-anchor="middle" font-weight="600">W7</text>
    <text x="760" y="105" text-anchor="middle" font-weight="600" fill="#999">time →</text>
  </g>

  <!-- The condition: Hypertension diagnosed 1984 (before W1), never resolved -->
  <text x="118" y="160" text-anchor="end" font-size="12.5" fill="#1a1a2e" font-weight="600">Hypertension</text>
  <text x="118" y="176" text-anchor="end" font-size="10.5" fill="#888">START 1984 · STOP = null</text>

  <!-- Diagnosis event marker -->
  <circle cx="70" cy="200" r="7" fill="#e63946"/>
  <text x="70" y="230" text-anchor="middle" font-size="10.5" fill="#e63946" font-weight="600">diagnosed</text>
  <text x="70" y="244" text-anchor="middle" font-size="10.5" fill="#e63946" font-weight="600">1984</text>
  <line x1="70" y1="207" x2="70" y2="120" stroke="#e63946" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- EVENT-BASED row -->
  <rect x="18" y="270" width="824" height="80" rx="8" fill="#fdeaec" stroke="#e63946" stroke-width="1"/>
  <text x="34" y="296" font-size="14" font-weight="700" fill="#c1121f">EVENT-BASED (old approach)</text>
  <text x="34" y="316" font-size="11.5" fill="#8a1a24">Counts a condition only in the single wave it was diagnosed.</text>
  <text x="34" y="334" font-size="11.5" fill="#8a1a24">Diagnosis is before W1 → the condition is invisible in every wave. Counted: <tspan font-weight="700">0 times</tspan>.</text>
  <!-- single point -->
  <circle cx="70" cy="305" r="6" fill="#e63946"/>

  <!-- INTERVAL-BASED row -->
  <rect x="18" y="366" width="824" height="90" rx="8" fill="#e7f5ec" stroke="#2a9d5c" stroke-width="1"/>
  <text x="34" y="392" font-size="14" font-weight="700" fill="#1b7a44">INTERVAL-BASED (our fix)</text>
  <text x="34" y="412" font-size="11.5" fill="#155e34">Condition is ACTIVE in a wave iff  START ≤ wave_end  AND  (STOP is null OR STOP ≥ wave_start).</text>
  <!-- active bar across all waves -->
  <rect x="120" y="426" width="640" height="18" rx="4" fill="#2a9d5c" opacity="0.85"/>
  <text x="440" y="439" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">ACTIVE across W1–W7  →  counted in all 7 waves</text>

  <text x="430" y="500" text-anchor="middle" font-size="12" fill="#444" font-style="italic">A chronic condition persists forward through time with no new row per wave. Event counting misses this entirely.</text>
</svg>
