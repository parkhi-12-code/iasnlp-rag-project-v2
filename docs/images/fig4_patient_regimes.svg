<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="480" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e">Two Verification Anchors — Both Regimes Covered</text>
  <text x="430" y="58" text-anchor="middle" font-size="13" fill="#555">Active-condition count per wave. Logic verified where ground truth is known, across both behaviours.</text>

  <!-- plot area -->
  <line x1="110" y1="400" x2="770" y2="400" stroke="#999" stroke-width="1.5"/>
  <line x1="110" y1="90" x2="110" y2="400" stroke="#999" stroke-width="1.5"/>

  <!-- y gridlines 0,5,10,15,20 : baseline y=400 (0), top ~ value 22 -> y=100 => ~13.6px/unit -->
  <g font-size="11" fill="#888">
    <line x1="110" y1="400" x2="770" y2="400" stroke="#eee"/>
    <text x="102" y="404" text-anchor="end">0</text>
    <line x1="110" y1="332" x2="770" y2="332" stroke="#eee"/>
    <text x="102" y="336" text-anchor="end">5</text>
    <line x1="110" y1="264" x2="770" y2="264" stroke="#eee"/>
    <text x="102" y="268" text-anchor="end">10</text>
    <line x1="110" y1="196" x2="770" y2="196" stroke="#eee"/>
    <text x="102" y="200" text-anchor="end">15</text>
    <line x1="110" y1="128" x2="770" y2="128" stroke="#eee"/>
    <text x="102" y="132" text-anchor="end">20</text>
  </g>
  <text x="60" y="245" text-anchor="middle" font-size="12" fill="#555" transform="rotate(-90 60 245)">active conditions</text>

  <!-- x labels W1..W7 evenly: 110..770 => step ~94, start 155 -->
  <g font-size="12" fill="#333" font-weight="600">
    <text x="155" y="420" text-anchor="middle">W1</text>
    <text x="249" y="420" text-anchor="middle">W2</text>
    <text x="343" y="420" text-anchor="middle">W3</text>
    <text x="437" y="420" text-anchor="middle">W4</text>
    <text x="531" y="420" text-anchor="middle">W5</text>
    <text x="625" y="420" text-anchor="middle">W6</text>
    <text x="719" y="420" text-anchor="middle">W7</text>
  </g>

  <!-- Sanford (saturation): 15,16,18,18,19,21,18  -> y = 400 - v*13.6 -->
  <!-- W1=15->196.4 W2=16->182.8 W3=18->155.2 W4=18->155.2 W5=19->141.6 W6=21->114.4 W7=18->155.2 -->
  <polyline points="155,196 249,183 343,155 437,155 531,142 625,114 719,155" fill="none" stroke="#c1121f" stroke-width="2.5"/>
  <g fill="#c1121f">
    <circle cx="155" cy="196" r="4"/><circle cx="249" cy="183" r="4"/><circle cx="343" cy="155" r="4"/>
    <circle cx="437" cy="155" r="4"/><circle cx="531" cy="142" r="4"/><circle cx="625" cy="114" r="4"/><circle cx="719" cy="155" r="4"/>
  </g>

  <!-- Kelly (growth): 1,1,3,7,13,12,12 -->
  <!-- W1=1->386.4 W2=1->386.4 W3=3->359.2 W4=7->304.8 W5=13->223.2 W6=12->236.8 W7=12->236.8 -->
  <polyline points="155,386 249,386 343,359 437,305 531,223 625,237 719,237" fill="none" stroke="#2a6fd6" stroke-width="2.5"/>
  <g fill="#2a6fd6">
    <circle cx="155" cy="386" r="4"/><circle cx="249" cy="386" r="4"/><circle cx="343" cy="359" r="4"/>
    <circle cx="437" cy="305" r="4"/><circle cx="531" cy="223" r="4"/><circle cx="625" cy="237" r="4"/><circle cx="719" cy="237" r="4"/>
  </g>

  <!-- annotations -->
  <text x="625" y="104" text-anchor="middle" font-size="11" fill="#c1121f" font-weight="600">peak 21</text>
  <text x="437" y="298" text-anchor="middle" font-size="10.5" fill="#2a6fd6" font-weight="600">diabetes cascade</text>

  <!-- legend -->
  <rect x="130" y="446" width="14" height="14" fill="#c1121f"/>
  <text x="150" y="458" font-size="12" fill="#333"><tspan font-weight="600">Sanford861</tspan> (b.1923) — saturation: enters W1 already carrying 15 chronic conditions</text>
  <rect x="130" y="446" width="0" height="0"/>
  <rect x="130" y="466" width="0" height="0"/>
  <g transform="translate(0,20)">
    <rect x="130" y="446" width="14" height="14" fill="#2a6fd6"/>
    <text x="150" y="458" font-size="12" fill="#333"><tspan font-weight="600">Kelly223</tspan> (b.1966) — growth: 1 → 13 as disease accumulates inside the window</text>
  </g>
</svg>
